# On each release tag, open a PR in firstpromoter/docs that copies skills/ into
# .mintlify/skills/, so the docs site's skills discovery endpoints
# (/.well-known/skills/) serve these same skills.
# Needs secret DOCS_REPO_TOKEN: fine-grained token (or GitHub App token) with
# contents + pull-requests write on firstpromoter/docs.
name: Sync skills to docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: skills

      - uses: actions/checkout@v4
        with:
          repository: firstpromoter/docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs

      - name: Copy skills
        run: |
          mkdir -p docs/.mintlify/skills
          rsync -a --delete skills/skills/ docs/.mintlify/skills/

      - uses: peter-evans/create-pull-request@v7
        with:
          path: docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          branch: sync-skills
          commit-message: "chore: sync agent skills from firstpromoter/skills ${{ github.ref_name }}"
          title: "Sync agent skills ${{ github.ref_name }}"
          body: |
            Copies `skills/` from [firstpromoter/skills@${{ github.ref_name }}](https://github.com/firstpromoter/skills/tree/${{ github.ref_name }}) into `.mintlify/skills/`.
            This replaces Mintlify's generated `skill.md`. Edit skills in firstpromoter/skills, not here.
