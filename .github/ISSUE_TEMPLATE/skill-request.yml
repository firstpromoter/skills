name: Skill request
description: Suggest a new skill or an improvement.
labels: [skill-request]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want your agent to do?
      placeholder: e.g. Migrate my affiliates from another platform.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: How do you do it today?
